name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    name: Rust check (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rml
        uses: actions/checkout@v6
        with:
          path: rml

      - name: Checkout rmlib (dev)
        uses: actions/checkout@v6
        with:
          repository: musdev13/rmlib
          ref: dev
          path: rmlib

      - name: Checkout musutils (dev)
        uses: actions/checkout@v6
        with:
          repository: musdev13/musutils
          ref: dev
          path: musutils

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check
        working-directory: rml
        run: make check

  check-windows:
    name: Rust check (Windows target)
    runs-on: windows-latest

    steps:
      - name: Checkout rml
        uses: actions/checkout@v6
        with:
          path: rml

      - name: Checkout rmlib (dev)
        uses: actions/checkout@v6
        with:
          repository: musdev13/rmlib
          ref: dev
          path: rmlib

      - name: Checkout musutils (dev)
        uses: actions/checkout@v6
        with:
          repository: musdev13/musutils
          ref: dev
          path: musutils

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Install mingw-w64
        run: choco install mingw -y --no-progress

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Check (Windows target)
        working-directory: rml
        shell: bash
        run: make check-windows

  docs:
    name: Docs build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rml
        uses: actions/checkout@v6
        with:
          path: rml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rml/req.txt

      - name: Install MkDocs dependencies
        working-directory: rml
        run: pip install -r req.txt

      - name: Build documentation (strict)
        working-directory: rml
        run: mkdocs build --strict
