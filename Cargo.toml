[package]
name = "rml"
version = "0.10.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/musdev13/rml"


[features]
default = ["ely"]
ely = ["rmlib/ely"]

[dependencies]
musutils = { path = "../musutils", features = ["vec-v2", "types-v2", "color-v2"] }
rmlib = { path = "../rmlib", default-features = false, features = ["core"] }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.54", features = ["full"] }
serde_json = "1.0.154"
rpassword = "7.5.4"
crossterm = "0.29.0"